# ============================================================================
#  UFC 3 Undisputed — manual declarations for the codegen
#
#  Included from ufc3_manifest.toml via includes = ["overrides.toml"].
#  Included files use the flat schema (sections at the root), not the one
#  nested under [entrypoint] in the manifest.
#
#  EVERY address here was derived from THIS game's own default.xex. None of
#  the Need for Speed: Most Wanted addresses the fork carried are valid here
#  (AGENTS.md, "Hard rules"). When you add an entry, say where it came from.
#
#  This game's executable (tools/fase1_extraer.py on the retail ISO):
#    Title ID          5451087D
#    Media ID          3E0E52AB
#    Image base        0x82000000
#    Image size        23,330,816 bytes -> 0x82000000 - 0x8363F400
#    Entry point       0x823C7E68
# ============================================================================

# ----------------------------------------------------------------------------
#  FUNCTIONS DECLARED BY HAND
#
#  Key = start address (hex, in quotes).
#  Fields, all optional:
#    name             symbol name (default: sub_XXXXXXXX)
#    size             size in bytes          \ mutually exclusive
#    end              end address            /
#    parent           address of the parent function (discontiguous fragment)
#    share_registers  the fragment shares the parent's registers
#
#  Without size or end, the analyzer finds the bounds by itself from the
#  address. That is what we want when all it needs to be told is "a function
#  starts here".
# ----------------------------------------------------------------------------
[functions]

# --- Found by the code generator itself (not by hand) ---
#
# The first codegen run on this game (no overrides at all) failed validation
# with exactly these four UnresolvedCall errors: a `b` to an address that the
# analyzer never opened as a function. All four targets are inside the image
# (0x82000000 - 0x8363F400), so each is a real function whose prologue the
# analyzer did not recognise. Declaring the start address is enough; the
# analyzer finds the bounds from there.
#
#   0x82691BC0  called from 0x82691BF4
#   0x82F451D0  called from 0x82F4CF14
#   0x8232F760  called from 0x82322C7C
#   0x82314918  called from 0x82EE8E0C
"0x82691BC0" = {}
"0x82F451D0" = {}
"0x8232F760" = {}
"0x82314918" = {}

# --- Found by re-running the code generator after declaring the gaps ---
#
# One warning left after app/huecos.toml (generated by tools/huecos_punteros.py)
# covers the code the game reaches through a pointer:
#
#     Unresolved conditional branch to 0x82FAACF8 from 0x82FAACF0
#
# The instruction at 0x82FAACF0 is `bne cr6,+8`, and the target is 8 bytes ahead:
#
#     0x82FAACF0  409A0008  bne cr6,0x82FAACF8
#     0x82FAACF4  38E00000  li  r7,0
#     0x82FAACF8  390B0001  addi r8,r11,1     <- the target
#
# Real code inside the image, which the analyzer left out of the function's
# block list. Declaring the start address is enough.
"0x82FAACF8" = {}
