# ReXGlue codegen manifest for UFC 3 Undisputed (Xbox 360) -> Nintendo Switch.
#
# [project].name is the port's identity inside the code generator: it must be a
# valid C++ identifier (letters, digits, underscore), because everything derived
# from it has to be one - the generated header prefix (ufc3_undisputed_nx_pch.h,
# _funcs.N.h, _init.cpp), the `ufc3_undisputed_nx_codegen` CMake target and the
# REX_DEFINE_APP identifier. That is why the generator also requires this file to
# be ufc3_undisputed_nx_manifest.toml, with underscores.
#
# The names a person reads keep the dashes, as AGENTS.md §4 asks:
# app/ufc3-undisputed-nx.toml, the .nro, the cvar prefix, sdmc:/switch/ufc3-undisputed-nx/.
[project]
name = "ufc3_undisputed_nx"
sdk_version = "0.10.0"
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/default.xex"
out_directory_path = "generated/default"

# The includes are processed before this table, so whatever is set here
# overrides what is included.
#
#   overrides.toml  written by hand: specific findings, each with its explanation
#   huecos.toml     generated by tools/huecos_punteros.py: the code gaps the game
#                   reaches through a pointer
#
# overrides.toml holds the four addresses this game's own first codegen run
# reported as UnresolvedCall (see the file). Every other address the fork carried
# belonged to Need for Speed: Most Wanted and was deleted.
#
# huecos.toml is generated from THIS game's own default.xex, not inherited: its
# 2,757 addresses are the ones the guest image actually stores as code pointers
# and that the analysis left without a function. Without them the game stops at
# the first one with
#     [FATAL] Call to invalid or unregistered function at guest address 0x...
# which the generator's own validation cannot find, because it only checks direct
# branches (AGENTS.md trap 2). Regenerate it with tools/huecos_punteros.py; do
# not hand-edit it.
includes = ["overrides.toml", "huecos.toml"]
